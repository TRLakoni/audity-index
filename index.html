<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audity - Enterprise SEO Analysis Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Premium Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.6s ease-out;
        }

        .animate-fadeInScale {
            animation: fadeInScale 0.5s ease-out;
        }

        .animate-slideInRight {
            animation: slideInRight 0.5s ease-out;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient 15s ease infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Glass Morphism */
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Premium Gradients */
        .gradient-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .gradient-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .gradient-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .gradient-premium {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }

        /* Premium Shadows */
        .shadow-premium {
            box-shadow: 0 20px 60px -10px rgba(102, 126, 234, 0.3);
        }

        .shadow-glow {
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.4);
        }

        /* Circular Progress */
        @keyframes progressFill {
            from {
                stroke-dashoffset: 314;
            }
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring-circle {
            stroke-dasharray: 314;
            stroke-dashoffset: 314;
            animation: progressFill 1.5s ease-out forwards;
        }

        /* Premium Background */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
        }

        /* Dark Mode Background */
        .dark-mode-bg {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%) !important;
            background-attachment: fixed;
        }

        .bg-pattern {
            background-image:
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(240, 147, 251, 0.3) 0%, transparent 50%);
        }

        /* Hover Effects */
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .hover-lift:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        /* Number Counter Animation */
        @keyframes countUp {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .count-up {
            animation: countUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>

                ),

                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">

        // Skeleton component for loading states
        function Skeleton({ className = "" }) {
            return (
                <div className={`animate-pulse bg-gray-300 rounded ${className}`}></div>
            );
        }

        // Animated Number Counter Component
        function AnimatedCounter({ target, duration = 2000 }) {
            const [count, setCount] = useState(0);

            useEffect(() => {
                let startTime;
                let animationFrame;

                const animate = (currentTime) => {
                    if (!startTime) startTime = currentTime;
                    const progress = Math.min((currentTime - startTime) / duration, 1);

                    // Ease out animation
                    const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                    const currentCount = Math.floor(easeOutQuart * target);

                    setCount(currentCount);

                    if (progress < 1) {
                        animationFrame = requestAnimationFrame(animate);
                    } else {
                        setCount(target);
                    }
                };

                animationFrame = requestAnimationFrame(animate);

                return () => {
                    if (animationFrame) {
                        cancelAnimationFrame(animationFrame);
                    }
                };
            }, [target, duration]);

            return <>{count}</>;
        }

        // Premium Circular Progress Component with Animations
        function CircularProgress({ score, size = 120, strokeWidth = 8, label = "", darkMode = false }) {
            const [animatedScore, setAnimatedScore] = useState(0);
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (animatedScore / 100) * circumference;

            const getColor = (score) => {
                if (score >= 80) return '#10b981'; // green
                if (score >= 60) return '#f59e0b'; // yellow
                return '#ef4444'; // red
            };

            // Animate the progress ring
            useEffect(() => {
                const timer = setTimeout(() => {
                    setAnimatedScore(score);
                }, 100);
                return () => clearTimeout(timer);
            }, [score]);

            return (
                <div
                    style={{
                        position: 'relative',
                        width: size,
                        height: size,
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        borderRadius: '50%',
                        overflow: 'visible'
                    }}
                >
                    <svg
                        width={size}
                        height={size}
                        style={{
                            position: 'absolute',
                            top: 0,
                            left: 0,
                            transform: 'rotate(-90deg)',
                            overflow: 'visible'
                        }}
                    >
                        {/* Background circle */}
                        <circle
                            cx={size / 2}
                            cy={size / 2}
                            r={radius}
                            stroke={darkMode ? 'rgba(150, 150, 150, 0.3)' : 'rgba(200, 200, 200, 0.2)'}
                            strokeWidth={strokeWidth}
                            fill="none"
                        />
                        {/* Progress circle with smooth animation */}
                        <circle
                            cx={size / 2}
                            cy={size / 2}
                            r={radius}
                            stroke={getColor(score)}
                            strokeWidth={strokeWidth}
                            fill="none"
                            strokeDasharray={circumference}
                            strokeDashoffset={offset}
                            strokeLinecap="round"
                            style={{
                                transition: 'stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1)',
                                filter: `drop-shadow(0 0 8px ${getColor(score)}60)`
                            }}
                        />
                    </svg>
                    <div
                        style={{
                            position: 'relative',
                            zIndex: 1,
                            display: 'flex',
                            flexDirection: 'column',
                            alignItems: 'center',
                            justifyContent: 'center',
                            pointerEvents: 'none'
                        }}
                    >
                        <span style={{
                            fontSize: '2.25rem',
                            fontWeight: 'bold',
                            color: darkMode ? '#ffffff' : '#111827',
                            lineHeight: 1
                        }}>
                            <AnimatedCounter target={score} duration={2000} />
                        </span>
                        {label && <span style={{
                            fontSize: '0.75rem',
                            color: darkMode ? '#d1d5db' : '#374151',
                            fontWeight: 500,
                            marginTop: '0.25rem'
                        }}>{label}</span>}
                    </div>
                </div>
            );
        }

        // Radar Chart Component for Category Comparison
        function RadarChart({ scores, size = 280, darkMode = false }) {
            const categories = [
                { name: 'Content', score: scores.content, angle: 0 },
                { name: 'Technical', score: scores.technical, angle: 90 },
                { name: 'Images', score: scores.images, angle: 180 },
                { name: 'Links', score: scores.links, angle: 270 }
            ];

            const center = size / 2;
            const maxRadius = (size / 2) - 60;
            const levels = 5;

            const getPoint = (angle, distance) => {
                const radian = (angle - 90) * (Math.PI / 180);
                return {
                    x: center + distance * Math.cos(radian),
                    y: center + distance * Math.sin(radian)
                };
            };

            const scorePoints = categories.map(cat => {
                const distance = (cat.score / 100) * maxRadius;
                return getPoint(cat.angle, distance);
            });

            const pathData = scorePoints.map((point, i) =>
                `${i === 0 ? 'M' : 'L'} ${point.x} ${point.y}`
            ).join(' ') + ' Z';

            return (
                <svg width={size} height={size} className="mx-auto">
                    {/* Background circles */}
                    {[...Array(levels)].map((_, i) => {
                        const radius = ((i + 1) / levels) * maxRadius;
                        return (
                            <circle
                                key={i}
                                cx={center}
                                cy={center}
                                r={radius}
                                fill="none"
                                stroke={darkMode ? 'rgba(150, 150, 150, 0.2)' : 'rgba(200, 200, 200, 0.3)'}
                                strokeWidth="1"
                            />
                        );
                    })}

                    {/* Axis lines */}
                    {categories.map((cat, i) => {
                        const endPoint = getPoint(cat.angle, maxRadius);
                        return (
                            <line
                                key={i}
                                x1={center}
                                y1={center}
                                x2={endPoint.x}
                                y2={endPoint.y}
                                stroke={darkMode ? 'rgba(150, 150, 150, 0.3)' : 'rgba(200, 200, 200, 0.5)'}
                                strokeWidth="1"
                            />
                        );
                    })}

                    {/* Score area */}
                    <path
                        d={pathData}
                        fill="rgba(102, 126, 234, 0.3)"
                        stroke="#667eea"
                        strokeWidth="2"
                        strokeLinejoin="round"
                    />

                    {/* Score points */}
                    {scorePoints.map((point, i) => (
                        <circle
                            key={i}
                            cx={point.x}
                            cy={point.y}
                            r="5"
                            fill="#667eea"
                            stroke="white"
                            strokeWidth="2"
                        />
                    ))}

                    {/* Labels */}
                    {categories.map((cat, i) => {
                        const labelPoint = getPoint(cat.angle, maxRadius + 35);
                        return (
                            <text
                                key={i}
                                x={labelPoint.x}
                                y={labelPoint.y}
                                textAnchor="middle"
                                dominantBaseline="middle"
                                className={`text-sm font-semibold ${darkMode ? 'fill-gray-200' : 'fill-gray-700'}`}
                            >
                                <tspan x={labelPoint.x} dy="-0.5em">{cat.name}</tspan>
                                <tspan x={labelPoint.x} dy="1.2em" className="font-bold text-base" fill="#667eea">{cat.score}</tspan>
                            </text>
                        );
                    })}
                </svg>
            );
        }

        // Progress Bar Component
        function ProgressBar({ value, max = 100, label, color = 'blue', darkMode = false }) {
            const percentage = (value / max) * 100;
            const colorClasses = {
                blue: 'bg-blue-500',
                green: 'bg-green-500',
                yellow: 'bg-yellow-500',
                red: 'bg-red-500',
                purple: 'bg-purple-500'
            };

            return (
                <div className="space-y-2">
                    {label && (
                        <div className="flex justify-between items-center">
                            <span className={`text-sm font-medium ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>{label}</span>
                            <span className={`text-sm font-bold ${darkMode ? 'text-gray-200' : 'text-gray-900'}`}>{value}/{max}</span>
                        </div>
                    )}
                    <div className={`w-full h-3 rounded-full overflow-hidden ${darkMode ? 'bg-gray-700' : 'bg-gray-200'}`}>
                        <div
                            className={`h-full ${colorClasses[color]} transition-all duration-1000 ease-out rounded-full`}
                            style={{ width: `${percentage}%` }}
                        />
                    </div>
                </div>
            );
        }

        // Category Breakdown Component with Detailed Metrics
        function CategoryBreakdown({ category, score, icon, darkMode = false }) {
            const [expanded, setExpanded] = useState(false);

            // Simulated detailed metrics based on score
            const getMetrics = (categoryName, score) => {
                const baseMetrics = {
                    content: [
                        { name: 'Keyword Usage', value: score + Math.floor(Math.random() * 10) - 5, max: 100 },
                        { name: 'Content Quality', value: score + Math.floor(Math.random() * 8) - 4, max: 100 },
                        { name: 'Readability', value: score + Math.floor(Math.random() * 12) - 6, max: 100 },

                    ],

                    ]
                };

                return baseMetrics[categoryName].map(m => ({
                    ...m,
                    value: Math.max(0, Math.min(100, m.value))
                }));
            };

            const metrics = getMetrics(category, score);
            const iconColors = {

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            componentDidCatch(error, errorInfo) {
                console.error('React Error:', error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="max-w-2xl mx-auto p-6">
                            <div className="bg-red-50 border-l-4 border-red-500 rounded-lg p-6">
                                <h2 className="text-2xl font-bold text-red-900 mb-4">Something went wrong</h2>
                                <p className="text-red-700 mb-4">The application encountered an error. Please refresh the page.</p>
                                <pre className="bg-red-100 p-4 rounded text-xs overflow-auto">
                                    {this.state.error?.toString()}
                                </pre>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="mt-4 bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700"
                                >
                                    Refresh Page
                                </button>
                            </div>
                        </div>
                    );
                }

                return this.props.children;
            }
        }

            // Load dark mode preference from localStorage on mount
            useEffect(() => {

                    }

            }, []);

            // Toggle dark mode and save to localStorage
            const toggleDarkMode = () => {
                const newDarkMode = !darkMode;
                setDarkMode(newDarkMode);
                try {

                    console.error('Failed to save dark mode preference:', e);
                }
            };

            // Load history from localStorage on mount
            useEffect(() => {
                try {

                        setHistory(JSON.parse(savedHistory));
                    }
                } catch (e) {
                    console.error('Failed to load history:', e);
                }
            }, []);

            // Save to history when analysis completes
            const saveToHistory = (url, results) => {
                const historyItem = {
                    url,
                    score: results.overallScore,
                    date: new Date().toISOString(),
                    timestamp: Date.now()
                };

                const newHistory = [historyItem, ...history.filter(item => item.url !== url)].slice(0, 10);
                setHistory(newHistory);

                try {
                    localStorage.setItem('audity-history', JSON.stringify(newHistory));
                } catch (e) {
                    console.error('Failed to save history:', e);
                }
            };

            // Scroll to results when they appear
            useEffect(() => {
                if (results && resultsRef.current) {
                    setTimeout(() => {
                        resultsRef.current.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }, 100);
                }
            }, [results]);

            // Validate and auto-correct URL
            const validateAndCorrectURL = (inputUrl) => {
                if (!inputUrl.trim()) {
                    setUrlError('');
                    return null;
                }

                let correctedUrl = inputUrl.trim();

                // Auto-add https:// if no protocol
                if (!correctedUrl.match(/^https?:\/\//i)) {
                    correctedUrl = 'https://' + correctedUrl;
                }

                // Validate URL format
                try {
                    const urlObj = new URL(correctedUrl);

                    // Check if it has a valid domain
                    if (!urlObj.hostname.includes('.')) {
                        setUrlError('Please enter a valid domain (e.g., example.com)');
                        return null;
                    }

                    setUrlError('');
                    return correctedUrl;
                } catch (e) {
                    setUrlError('Please enter a valid URL (e.g., https://example.com)');
                    return null;
                }
            };

            // Handle URL input change
            const handleUrlChange = (e) => {
                const inputUrl = e.target.value;
                setUrl(inputUrl);

                // Only validate if user has typed something

                            {results.lsiKeywords && results.lsiKeywords.length > 0 && (
                                <div className={`${darkMode ? 'glass-dark' : 'glass'} rounded-2xl shadow-premium p-8 hover-lift animate-fadeIn`}>
                                    <div className="flex items-center gap-2 mb-4">
                                        <Icon name="clipboard" className="w-6 h-6 text-blue-600" />
                                        <h3 className={`text-xl font-bold ${darkMode ? 'text-white' : 'text-gray-900'}`}>LSI Keywords (Related Terms)</h3>
                                    </div>
                                    <p className={`text-sm mb-6 ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>
                                        Latent Semantic Indexing keywords help search engines understand your content context better.
                                    </p>
                                    <div className="flex flex-wrap gap-3">
                                        {results.lsiKeywords.map((lsiKw, idx) => (
                                            <div key={idx} className={`px-4 py-2 rounded-lg border transition-all duration-300 hover:scale-105 ${darkMode ? 'bg-gradient-to-r from-blue-900/40 to-indigo-900/40 border-blue-500/30 text-blue-200' : 'bg-gradient-to-r from-blue-50 to-indigo-50 border-blue-200 text-blue-900'}`}>
                                                <span className="font-medium">{lsiKw.keyword || lsiKw}</span>
                                                {lsiKw.count && (
                                                    <span className={`ml-2 text-sm ${darkMode ? 'text-blue-300' : 'text-blue-600'}`}>({lsiKw.count})</span>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Premium Heading Hierarchy Section */}
                            {results.headingHierarchy && results.headingHierarchy.length > 0 && (
                                <div className={`${darkMode ? 'glass-dark' : 'glass'} rounded-2xl shadow-premium p-8 hover-lift animate-fadeIn`}>
                                    <div className="flex items-center gap-2 mb-4">
                                        <Icon name="file-text" className="w-6 h-6 text-indigo-600" />
                                        <h3 className={`text-xl font-bold ${darkMode ? 'text-white' : 'text-gray-900'}`}>Heading Hierarchy</h3>
                                    </div>
                                    <p className={`text-sm mb-6 ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>
                                        Proper heading structure helps both users and search engines understand your content organization.
                                    </p>
                                    <div className="space-y-2">
                                        {results.headingHierarchy.map((heading, idx) => {
                                            const level = parseInt(heading.level || heading.tag?.replace('h', '') || '1');
                                            const indent = (level - 1) * 20;
                                            const colors = {
                                                1: darkMode ? 'bg-purple-900/30 text-purple-200 border-purple-500' : 'bg-purple-100 text-purple-900 border-purple-300',
                                                2: darkMode ? 'bg-blue-900/30 text-blue-200 border-blue-500' : 'bg-blue-100 text-blue-900 border-blue-300',
                                                3: darkMode ? 'bg-green-900/30 text-green-200 border-green-500' : 'bg-green-100 text-green-900 border-green-300',
                                                4: darkMode ? 'bg-yellow-900/30 text-yellow-200 border-yellow-500' : 'bg-yellow-100 text-yellow-900 border-yellow-300',
                                                5: darkMode ? 'bg-orange-900/30 text-orange-200 border-orange-500' : 'bg-orange-100 text-orange-900 border-orange-300',
                                                6: darkMode ? 'bg-red-900/30 text-red-200 border-red-500' : 'bg-red-100 text-red-900 border-red-300'
                                            };
                                            const colorClass = colors[level] || colors[6];

                                            return (
                                                <div
                                                    key={idx}
                                                    className={`p-3 rounded-lg border-l-4 transition-all duration-300 hover:scale-[1.02] ${colorClass}`}
                                                    style={{marginLeft: `${indent}px`}}
                                                >
                                                    <div className="flex items-start gap-3">
                                                        <span className={`font-bold text-sm px-2 py-1 rounded ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                                            H{level}
                                                        </span>
                                                        <p className="flex-1 font-medium">
                                                            {heading.text || heading.content || 'Empty heading'}
                                                        </p>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Premium Contact Form Modal */}
                    {showContactForm && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
                            <div className={`${darkMode ? 'glass-dark' : 'glass'} rounded-2xl shadow-2xl max-w-md w-full p-8 animate-fadeInScale`}>
                                {formSubmitted ? (
                                    <div className="text-center py-8">
                                        <div className="text-green-600 text-6xl mb-4">✓</div>
                                        <h3 className={`text-2xl font-bold mb-2 ${darkMode ? 'text-white' : 'text-gray-900'}`}>Thank You!</h3>
                                        <p className={`${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>
                                            We'll send your custom SEO improvement plan within 24 hours.
                                        </p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className={`text-2xl font-bold mb-2 ${darkMode ? 'text-white' : 'text-gray-900'}`}>Get Your Custom Plan</h3>
                                                <p className={`${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Our experts will analyze your site</p>
                                            </div>
                                            <button
                                                onClick={() => setShowContactForm(false)}
                                                className={`text-2xl ${darkMode ? 'text-gray-400 hover:text-gray-200' : 'text-gray-400 hover:text-gray-600'}`}
                                            >
                                                ✕
                                            </button>
                                        </div>
                                        
                                        <form onSubmit={handleContactSubmit} className="space-y-4">
                                            <div>
                                                <label className={`block text-sm font-medium mb-1 ${darkMode ? 'text-gray-200' : 'text-gray-700'}`}>Name</label>
                                                <input
                                                    type="text"
                                                    required
                                                    value={formData.name}
                                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                    className={`w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 ${darkMode ? 'bg-gray-700 text-white border-gray-600 placeholder-gray-400' : 'bg-white text-gray-900 border-gray-300'}`}
                                                    placeholder="John Doe"
                                                />
                                            </div>

                                            <div>
                                                <label className={`block text-sm font-medium mb-1 ${darkMode ? 'text-gray-200' : 'text-gray-700'}`}>Email</label>
                                                <input
                                                    type="email"
                                                    required
                                                    value={formData.email}
                                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                                    className={`w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 ${darkMode ? 'bg-gray-700 text-white border-gray-600 placeholder-gray-400' : 'bg-white text-gray-900 border-gray-300'}`}
                                                    placeholder="john@example.com"
                                                />
                                            </div>

                                            <div>
                                                <label className={`block text-sm font-medium mb-1 ${darkMode ? 'text-gray-200' : 'text-gray-700'}`}>Goals (optional)</label>
                                                <textarea
                                                    value={formData.message}
                                                    onChange={(e) => setFormData({...formData, message: e.target.value})}
                                                    className={`w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 ${darkMode ? 'bg-gray-700 text-white border-gray-600 placeholder-gray-400' : 'bg-white text-gray-900 border-gray-300'}`}
                                                    rows="3"
                                                    placeholder="I want to rank higher for..."
                                                />
                                            </div>
                                            
                                            <div className={`p-3 rounded-lg text-sm ${darkMode ? 'bg-blue-900/30' : 'bg-blue-50'}`}>
                                                <p className={`font-semibold ${darkMode ? 'text-blue-200' : 'text-blue-900'}`}>Site: {url}</p>
                                                <p className={darkMode ? 'text-blue-300' : 'text-blue-700'}>Score: {results?.overallScore}/100</p>
                                            </div>
                                            
                                            <button
                                                type="submit"
                                                className="w-full gradient-premium text-white py-4 rounded-xl font-bold hover:shadow-glow transition-all text-lg"
                                            >
                                                Send Me My Custom Plan
                                            </button>
                                            
                                            <p className="text-xs text-gray-500 text-center">
                                                Free • No credit card • 24hr response
                                            </p>
                                        </form>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                    </div>

                    {/* Premium Footer */}
                    <div className="max-w-7xl mx-auto px-6 py-8 text-center">
                        <div className={`${darkMode ? 'glass-dark' : 'glass'} rounded-2xl p-6 inline-block`}>
                            <p className={`text-sm ${darkMode ? 'text-gray-200' : 'text-gray-800'}`}>
                                Powered by <span className="font-bold">Audity</span> Enterprise SEO Platform
                            </p>
                            <p className={`text-xs mt-1 ${darkMode ? 'text-gray-400' : 'text-gray-700'}`}>
                                AI-Driven Website Analysis • Real-Time Insights • Professional Reports
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <SEOTool />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
