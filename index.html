<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audity - SEO Analysis Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Professional SVG icon component using Heroicons
        function Icon({ name, className = "w-5 h-5" }) {
            const icons = {
                'search': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />

                'rocket': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />

                    </svg>
                ),
                'image': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>
                ),
                'link': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" />
                    </svg>
                ),
                'alert-circle': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">

                    </svg>
                ),
                'x-circle': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                ),
                'lightbulb': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" />
                    </svg>
                ),
                'check-circle': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                ),
                'trending-up': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941" />
                    </svg>
                ),
                'alert-triangle': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                    </svg>
                ),
                'spinner': (
                    <svg className={className + " animate-spin"} fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                ),
                'download': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                ),
                'clipboard': (
                    <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
                    </svg>
                )
            };

            return icons[name] || null;
        }

        // Skeleton component for loading states
        function Skeleton({ className = "" }) {
            return (
                <div className={`animate-pulse bg-gray-300 rounded ${className}`}></div>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            componentDidCatch(error, errorInfo) {
                console.error('React Error:', error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="max-w-2xl mx-auto p-6">
                            <div className="bg-red-50 border-l-4 border-red-500 rounded-lg p-6">
                                <h2 className="text-2xl font-bold text-red-900 mb-4">Something went wrong</h2>
                                <p className="text-red-700 mb-4">The application encountered an error. Please refresh the page.</p>
                                <pre className="bg-red-100 p-4 rounded text-xs overflow-auto">
                                    {this.state.error?.toString()}
                                </pre>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="mt-4 bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700"
                                >
                                    Refresh Page
                                </button>
                            </div>
                        </div>
                    );
                }

                return this.props.children;
            }
        }

        function SEOTool() {
            const [url, setUrl] = useState('');
            const [keyword, setKeyword] = useState('');
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);
            const [urlError, setUrlError] = useState('');
            const [showContactForm, setShowContactForm] = useState(false);
            const [formData, setFormData] = useState({ name: '', email: '', message: '' });
            const [formSubmitted, setFormSubmitted] = useState(false);

            // Validate and auto-correct URL
            const validateAndCorrectURL = (inputUrl) => {
                if (!inputUrl.trim()) {
                    setUrlError('');
                    return null;
                }

                let correctedUrl = inputUrl.trim();

                // Auto-add https:// if no protocol
                if (!correctedUrl.match(/^https?:\/\//i)) {
                    correctedUrl = 'https://' + correctedUrl;
                }

                // Validate URL format
                try {
                    const urlObj = new URL(correctedUrl);

                    // Check if it has a valid domain
                    if (!urlObj.hostname.includes('.')) {
                        setUrlError('Please enter a valid domain (e.g., example.com)');
                        return null;
                    }

                    setUrlError('');
                    return correctedUrl;
                } catch (e) {
                    setUrlError('Please enter a valid URL (e.g., https://example.com)');
                    return null;
                }
            };

            // Handle URL input change
            const handleUrlChange = (e) => {
                const inputUrl = e.target.value;
                setUrl(inputUrl);

                // Only validate if user has typed something
                if (inputUrl.trim()) {
                    validateAndCorrectURL(inputUrl);
                } else {
                    setUrlError('');
                }
            };

            const analyzeURL = async () => {
                if (!url) return;

                // Validate and correct URL before sending
                const validatedUrl = validateAndCorrectURL(url);
                if (!validatedUrl) {
                    return; // Don't proceed if URL is invalid
                }

                // Update the input with corrected URL
                setUrl(validatedUrl);

                // Clear previous results and errors
                setLoading(true);
                setError(null);
                setResults(null);

                try {
                    const backendUrl = 'https://audity-backend-production.up.railway.app/api/analyze';
                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: validatedUrl, keyword })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        console.log('API Response:', data);

                        // Validate response data structure to prevent crashes
                        const validatedData = {
                            overallScore: data.overallScore || 0,
                            categoryScores: {
                                content: data.categoryScores?.content || 0,
                                technical: data.categoryScores?.technical || 0,
                                images: data.categoryScores?.images || 0,
                                links: data.categoryScores?.links || 0
                            },
                            issues: Array.isArray(data.issues) ? data.issues : [],
                            recommendations: Array.isArray(data.recommendations) ? data.recommendations : [],
                            keywords: Array.isArray(data.keywords) ? data.keywords : []
                        };

                        console.log('Validated Data:', validatedData);
                        setResults(validatedData);
                        setError(null);
                    } else {
                        const errorText = await response.text();
                        console.error('Server error:', response.status, errorText);
                        setError(`Server error (${response.status}): ${errorText || 'Unknown error'}`);
                        setResults(null);
                    }
                } catch (error) {
                    console.error('Analysis error:', error);
                    setError(`Network error: ${error.message}`);
                    setResults(null);
                }

                setLoading(false);
            };

            const handleContactSubmit = (e) => {
                e.preventDefault();
                console.log('Lead captured:', { ...formData, url, score: results?.overallScore });
                setFormSubmitted(true);
                setTimeout(() => {
                    setShowContactForm(false);
                    setFormSubmitted(false);
                    setFormData({ name: '', email: '', message: '' });
                }, 3000);
            };

            const getScoreColor = (score) => {
                if (score >= 80) return 'text-green-600';
                if (score >= 60) return 'text-yellow-600';
                return 'text-red-600';
            };

            // Export results as text
            const exportResults = () => {
                if (!results) return;

                const reportText = `
SEO ANALYSIS REPORT
Website: ${url}
Generated: ${new Date().toLocaleDateString()}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

OVERALL SCORE: ${results.overallScore}/100

CATEGORY SCORES:
• Content: ${results.categoryScores.content}/100
• Technical: ${results.categoryScores.technical}/100
• Images: ${results.categoryScores.images}/100
• Links: ${results.categoryScores.links}/100

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

ISSUES FOUND (${results.issues.length}):
${results.issues.length > 0
    ? results.issues.map((issue, i) => `${i + 1}. ${issue.issue}${issue.details ? '\n   ' + issue.details : ''}`).join('\n')
    : 'No issues found!'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RECOMMENDATIONS (${results.recommendations.length}):
${results.recommendations.length > 0
    ? results.recommendations.map((rec, i) => `${i + 1}. ${rec.recommendation}${rec.priority ? ' [' + rec.priority.toUpperCase() + ' PRIORITY]' : ''}`).join('\n')
    : 'No recommendations at this time.'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Generated by Audity - https://audity.com
                `.trim();

                return reportText;
            };

            // Copy report to clipboard
            const copyToClipboard = async () => {
                const reportText = exportResults();
                try {
                    await navigator.clipboard.writeText(reportText);
                    alert('✅ Report copied to clipboard!');
                } catch (err) {
                    console.error('Failed to copy:', err);
                    alert('❌ Failed to copy report. Please try again.');
                }
            };

            // Download report as text file
            const downloadReport = () => {
                const reportText = exportResults();
                const blob = new Blob([reportText], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `seo-report-${new Date().toISOString().split('T')[0]}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            };

            return (
                <div className="max-w-6xl mx-auto p-6">
                    {/* Header */}
                    <div className="text-center mb-8">
                        <div className="flex items-center justify-center gap-3 mb-2">
                            <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" className="w-16 h-16">
                                <defs>
                                    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style={{stopColor:'#2563eb', stopOpacity:1}} />
                                        <stop offset="100%" style={{stopColor:'#4f46e5', stopOpacity:1}} />
                                    </linearGradient>
                                </defs>
                                <circle cx="40" cy="40" r="38" fill="none" stroke="url(#logoGradient)" strokeWidth="4" opacity="0.3"/>
                                <path d="M 25 45 L 35 55 L 55 30" fill="none" stroke="url(#logoGradient)" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"/>
                                <rect x="20" y="50" width="8" height="15" fill="url(#logoGradient)" rx="2"/>
                                <rect x="32" y="42" width="8" height="23" fill="url(#logoGradient)" rx="2"/>
                                <rect x="44" y="34" width="8" height="31" fill="url(#logoGradient)" rx="2"/>
                                <rect x="56" y="26" width="8" height="39" fill="url(#logoGradient)" rx="2"/>
                            </svg>
                            <h1 className="text-5xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Audity</h1>
                        </div>
                        <p className="text-gray-600 text-lg">Complete website SEO audit in seconds</p>
                    </div>

                    {/* Input Form - This section will ALWAYS be visible */}
                    <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Website URL</label>
                                <input
                                    type="text"
                                    value={url}
                                    onChange={handleUrlChange}
                                    placeholder="example.com or https://example.com"
                                    className={`w-full px-4 py-2 border rounded-lg focus:ring-2 focus:border-transparent transition-colors ${
                                        urlError
                                            ? 'border-red-500 focus:ring-red-500'
                                            : url && !urlError
                                            ? 'border-green-500 focus:ring-green-500'
                                            : 'border-gray-300 focus:ring-blue-500'
                                    }`}
                                />
                                {urlError && (
                                    <p className="mt-2 text-sm text-red-600 flex items-center gap-1">
                                        <Icon name="alert-circle" className="w-4 h-4" />
                                        {urlError}
                                    </p>
                                )}
                                {url && !urlError && url.trim() && (
                                    <p className="mt-2 text-sm text-green-600 flex items-center gap-1">
                                        <Icon name="check-circle" className="w-4 h-4" />
                                        Valid URL format
                                    </p>
                                )}
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Target Keyword (Optional)</label>
                                <input
                                    type="text"
                                    value={keyword}
                                    onChange={(e) => setKeyword(e.target.value)}
                                    placeholder="e.g., best SEO tools"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                            </div>
                            <button
                                onClick={analyzeURL}
                                disabled={!url || loading || urlError}
                                className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-all duration-200"
                            >
                                {loading ? (
                                    <>
                                        <Icon name="spinner" className="w-5 h-5" />
                                        Analyzing...
                                    </>
                                ) : (
                                    <>
                                        <Icon name="search" />
                                        Analyze Website
                                    </>
                                )}
                            </button>
                        </div>
                    </div>

                    {/* Error Display */}
                    {error && (
                        <div className="bg-red-50 border-l-4 border-red-500 rounded-lg p-6 mb-6 animate-fadeIn">
                            <div className="flex items-start gap-3">
                                <Icon name="alert-triangle" className="w-6 h-6 text-red-600 flex-shrink-0 mt-0.5" />
                                <div>
                                    <h3 className="font-bold text-red-900 mb-1">Analysis Failed</h3>
                                    <p className="text-red-700">{error}</p>
                                    <p className="text-red-600 text-sm mt-2">Please check the console (F12) for more details.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Loading Skeleton */}
                    {loading && (
                        <div className="space-y-6 animate-fadeIn">
                            {/* Score Overview Skeleton */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <div className="text-center">
                                    <Skeleton className="h-8 w-48 mx-auto mb-4" />
                                    <Skeleton className="h-20 w-32 mx-auto mb-4" />
                                    <Skeleton className="h-6 w-64 mx-auto mb-6" />
                                    <Skeleton className="h-12 w-64 mx-auto" />
                                </div>
                            </div>

                            {/* Category Scores Skeleton */}
                            <div className="grid md:grid-cols-2 gap-4">
                                {[1, 2, 3, 4].map((i) => (
                                    <div key={i} className="bg-white rounded-lg shadow-lg p-6">
                                        <div className="flex items-center justify-between mb-2">
                                            <Skeleton className="h-6 w-24" />
                                            <Skeleton className="h-8 w-12" />
                                        </div>
                                        <Skeleton className="h-2 w-full" />
                                    </div>
                                ))}
                            </div>

                            {/* Issues Skeleton */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <Skeleton className="h-8 w-40 mb-4" />
                                <div className="space-y-3">
                                    {[1, 2, 3].map((i) => (
                                        <div key={i} className="p-4 bg-gray-50 rounded-lg">
                                            <Skeleton className="h-5 w-full mb-2" />
                                            <Skeleton className="h-4 w-3/4" />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Recommendations Skeleton */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <Skeleton className="h-8 w-48 mb-4" />
                                <div className="space-y-3">
                                    {[1, 2, 3].map((i) => (
                                        <div key={i} className="p-4 bg-gray-50 rounded-lg">
                                            <Skeleton className="h-5 w-full mb-2" />
                                            <Skeleton className="h-4 w-2/3" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Results Section - Only shows when results exist */}
                    {results && (
                        <div className="space-y-6 animate-fadeIn">
                            {/* Export Buttons */}
                            <div className="flex gap-3 justify-end">
                                <button
                                    onClick={copyToClipboard}
                                    className="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors shadow-sm"
                                >
                                    <Icon name="clipboard" className="w-5 h-5 text-gray-600" />
                                    <span className="text-sm font-medium text-gray-700">Copy Report</span>
                                </button>
                                <button
                                    onClick={downloadReport}
                                    className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm"
                                >
                                    <Icon name="download" className="w-5 h-5" />
                                    <span className="text-sm font-medium">Download Report</span>
                                </button>
                            </div>

                            {/* Score Overview */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <div className="text-center">
                                    <h2 className="text-2xl font-bold mb-4">Overall SEO Score</h2>
                                    <div className={`text-6xl font-bold ${getScoreColor(results.overallScore)} mb-4`}>
                                        {results.overallScore}/100
                                    </div>
                                    {results.overallScore === 0 ? (
                                        <div className="mb-6">
                                            <p className="text-gray-600 mb-2">
                                                We couldn't analyze your website properly.
                                            </p>
                                            <div className="bg-blue-50 border-l-4 border-blue-500 p-4 text-left">
                                                <p className="text-sm text-blue-800 mb-2"><strong>This might be because:</strong></p>
                                                <ul className="text-sm text-blue-700 list-disc list-inside space-y-1">
                                                    <li>The website is blocking our analyzer</li>
                                                    <li>The URL is not accessible</li>
                                                    <li>The site requires authentication</li>
                                                    <li>There's a temporary connection issue</li>
                                                </ul>
                                                <p className="text-sm text-blue-800 mt-3">
                                                    Try analyzing a different URL or contact us for help!
                                                </p>
                                            </div>
                                        </div>
                                    ) : (
                                        <p className="text-gray-600 mb-6">
                                            {results.overallScore >= 80 ? 'Excellent! Your site is well-optimized.' :
                                             results.overallScore >= 60 ? 'Good, but there\'s room for improvement.' :
                                             results.overallScore > 0 ? 'Your site needs significant SEO improvements.' :
                                             'Unable to analyze website.'}
                                        </p>
                                    )}
                                    <button
                                        onClick={() => setShowContactForm(true)}
                                        className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-8 py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-indigo-700 flex items-center gap-2 mx-auto"
                                    >
                                        <Icon name="rocket" />
                                        Get Custom Improvement Plan
                                    </button>
                                </div>
                            </div>

                            {/* Category Scores */}
                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <Icon name="file-text" className="w-5 h-5 text-blue-600" />
                                            <h3 className="font-bold">Content</h3>
                                        </div>
                                        <span className={`text-2xl font-bold ${getScoreColor(results.categoryScores.content)}`}>
                                            {results.categoryScores.content}
                                        </span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div
                                            className="bg-blue-600 h-2 rounded-full transition-all duration-1000 ease-out"
                                            style={{width: `${results.categoryScores.content}%`}}
                                        ></div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <Icon name="code" className="w-5 h-5 text-purple-600" />
                                            <h3 className="font-bold">Technical</h3>
                                        </div>
                                        <span className={`text-2xl font-bold ${getScoreColor(results.categoryScores.technical)}`}>
                                            {results.categoryScores.technical}
                                        </span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div
                                            className="bg-purple-600 h-2 rounded-full transition-all duration-1000 ease-out"
                                            style={{width: `${results.categoryScores.technical}%`}}
                                        ></div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <Icon name="image" className="w-5 h-5 text-green-600" />
                                            <h3 className="font-bold">Images</h3>
                                        </div>
                                        <span className={`text-2xl font-bold ${getScoreColor(results.categoryScores.images)}`}>
                                            {results.categoryScores.images}
                                        </span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div
                                            className="bg-green-600 h-2 rounded-full transition-all duration-1000 ease-out"
                                            style={{width: `${results.categoryScores.images}%`}}
                                        ></div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <Icon name="link" className="w-5 h-5 text-orange-600" />
                                            <h3 className="font-bold">Links</h3>
                                        </div>
                                        <span className={`text-2xl font-bold ${getScoreColor(results.categoryScores.links)}`}>
                                            {results.categoryScores.links}
                                        </span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div
                                            className="bg-orange-600 h-2 rounded-full transition-all duration-1000 ease-out"
                                            style={{width: `${results.categoryScores.links}%`}}
                                        ></div>
                                    </div>
                                </div>
                            </div>

                            {/* Issues */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <Icon name="alert-circle" className="w-6 h-6 text-red-600" />
                                    Issues Found ({results.issues.length})
                                </h3>
                                {results.issues.length > 0 ? (
                                    <div className="space-y-3">
                                        {results.issues.map((issue, index) => (
                                            <div key={index} className="flex items-start gap-3 p-4 bg-red-50 rounded-lg border-l-4 border-red-500">
                                                <Icon name="x-circle" className="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" />
                                                <div className="flex-1">
                                                    <p className="font-medium text-red-900">{issue.issue}</p>
                                                    {issue.details && (
                                                        <p className="text-sm text-red-700 mt-1">{issue.details}</p>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-8">
                                        <div className="text-6xl mb-4">🎉</div>
                                        <h4 className="text-xl font-bold text-green-600 mb-2">No Issues Found!</h4>
                                        <p className="text-gray-600">
                                            Great job! We couldn't find any critical SEO issues with your website.
                                        </p>
                                    </div>
                                )}
                            </div>

                            {/* Recommendations */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <Icon name="lightbulb" className="w-6 h-6 text-yellow-600" />
                                    Recommendations ({results.recommendations.length})
                                </h3>
                                {results.recommendations.length > 0 ? (
                                    <div className="space-y-3">
                                        {results.recommendations.map((rec, index) => (
                                            <div key={index} className="flex items-start gap-3 p-4 bg-yellow-50 rounded-lg border-l-4 border-yellow-500">
                                                <Icon name="check-circle" className="w-5 h-5 text-yellow-600 flex-shrink-0 mt-0.5" />
                                                <div className="flex-1">
                                                    <p className="font-medium text-yellow-900">{rec.recommendation}</p>
                                                    {rec.priority && (
                                                        <span className={`inline-block mt-2 px-3 py-1 rounded-full text-xs font-semibold ${
                                                            rec.priority === 'high' ? 'bg-red-100 text-red-800' :
                                                            rec.priority === 'medium' ? 'bg-yellow-100 text-yellow-800' :
                                                            'bg-green-100 text-green-800'
                                                        }`}>
                                                            {rec.priority.toUpperCase()} PRIORITY
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-8">
                                        <div className="text-6xl mb-4">✨</div>
                                        <h4 className="text-xl font-bold text-blue-600 mb-2">Your Site Looks Great!</h4>
                                        <p className="text-gray-600">
                                            We don't have any specific recommendations at this time. Keep up the good work!
                                        </p>
                                    </div>
                                )}
                            </div>

                            {/* Keywords */}
                            {results.keywords && results.keywords.length > 0 && (
                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center gap-2 mb-4">
                                        <Icon name="trending-up" className="w-6 h-6 text-green-600" />
                                        <h3 className="text-xl font-bold">Top Keywords</h3>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full">
                                            <thead className="bg-gray-50">
                                                <tr>
                                                    <th className="px-4 py-2 text-left font-semibold">Keyword</th>
                                                    <th className="px-4 py-2 text-left font-semibold">Count</th>
                                                    <th className="px-4 py-2 text-left font-semibold">Density</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {results.keywords.slice(0, 5).map((kw, idx) => (
                                                    <tr key={idx} className="border-t">
                                                        <td className="px-4 py-2">{kw.keyword}</td>
                                                        <td className="px-4 py-2">{kw.count}</td>
                                                        <td className="px-4 py-2">{kw.density}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Contact Form Modal */}
                    {showContactForm && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg shadow-2xl max-w-md w-full p-6">
                                {formSubmitted ? (
                                    <div className="text-center py-8">
                                        <div className="text-green-600 text-6xl mb-4">✓</div>
                                        <h3 className="text-2xl font-bold mb-2">Thank You!</h3>
                                        <p className="text-gray-600">
                                            We'll send your custom SEO improvement plan within 24 hours.
                                        </p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="text-2xl font-bold mb-2">Get Your Custom Plan</h3>
                                                <p className="text-gray-600">Our experts will analyze your site</p>
                                            </div>
                                            <button
                                                onClick={() => setShowContactForm(false)}
                                                className="text-gray-400 hover:text-gray-600 text-2xl"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                        
                                        <form onSubmit={handleContactSubmit} className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Name</label>
                                                <input
                                                    type="text"
                                                    required
                                                    value={formData.name}
                                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                                    placeholder="John Doe"
                                                />
                                            </div>
                                            
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                                <input
                                                    type="email"
                                                    required
                                                    value={formData.email}
                                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                                    placeholder="john@example.com"
                                                />
                                            </div>
                                            
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Goals (optional)</label>
                                                <textarea
                                                    value={formData.message}
                                                    onChange={(e) => setFormData({...formData, message: e.target.value})}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                                    rows="3"
                                                    placeholder="I want to rank higher for..."
                                                />
                                            </div>
                                            
                                            <div className="bg-blue-50 p-3 rounded-lg text-sm">
                                                <p className="font-semibold text-blue-900">Site: {url}</p>
                                                <p className="text-blue-700">Score: {results?.overallScore}/100</p>
                                            </div>
                                            
                                            <button
                                                type="submit"
                                                className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-indigo-700"
                                            >
                                                Send Me My Custom Plan
                                            </button>
                                            
                                            <p className="text-xs text-gray-500 text-center">
                                                Free • No credit card • 24hr response
                                            </p>
                                        </form>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <SEOTool />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
