<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audity - SEO Analysis Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Simple icon component using Unicode symbols to avoid DOM conflicts
        function Icon({ name, className = "w-5 h-5" }) {
            const iconMap = {
                'search': '🔍',
                'rocket': '🚀',
                'file-text': '📄',
                'code': '💻',
                'image': '🖼️',
                'link': '🔗',
                'alert-circle': '⚠️',
                'x-circle': '❌',
                'lightbulb': '💡',
                'check-circle': '✅',
                'trending-up': '📈',
                'alert-triangle': '⚠️'
            };

            return React.createElement('span', {
                className: className + ' inline-block',
                role: 'img',
                'aria-label': name
            }, iconMap[name] || '•');
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            componentDidCatch(error, errorInfo) {
                console.error('React Error:', error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="max-w-2xl mx-auto p-6">
                            <div className="bg-red-50 border-l-4 border-red-500 rounded-lg p-6">
                                <h2 className="text-2xl font-bold text-red-900 mb-4">Something went wrong</h2>
                                <p className="text-red-700 mb-4">The application encountered an error. Please refresh the page.</p>
                                <pre className="bg-red-100 p-4 rounded text-xs overflow-auto">
                                    {this.state.error?.toString()}
                                </pre>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="mt-4 bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700"
                                >
                                    Refresh Page
                                </button>
                            </div>
                        </div>
                    );
                }

                return this.props.children;
            }
        }

        function SEOTool() {
            const [url, setUrl] = useState('');
            const [keyword, setKeyword] = useState('');
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);
            const [showContactForm, setShowContactForm] = useState(false);
            const [formData, setFormData] = useState({ name: '', email: '', message: '' });
            const [formSubmitted, setFormSubmitted] = useState(false);

            const analyzeURL = async () => {
                if (!url) return;

                // Clear previous results and errors
                setLoading(true);
                setError(null);
                setResults(null);

                try {
                    const backendUrl = 'https://audity-backend-production.up.railway.app/api/analyze';
                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url, keyword })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        console.log('API Response:', data);

                        // Validate response data structure to prevent crashes
                        const validatedData = {
                            overallScore: data.overallScore || 0,
                            categoryScores: {
                                content: data.categoryScores?.content || 0,
                                technical: data.categoryScores?.technical || 0,
                                images: data.categoryScores?.images || 0,
                                links: data.categoryScores?.links || 0
                            },
                            issues: Array.isArray(data.issues) ? data.issues : [],
                            recommendations: Array.isArray(data.recommendations) ? data.recommendations : [],
                            keywords: Array.isArray(data.keywords) ? data.keywords : []
                        };

                        console.log('Validated Data:', validatedData);
                        setResults(validatedData);
                        setError(null);
                    } else {
                        const errorText = await response.text();
                        console.error('Server error:', response.status, errorText);
                        setError(`Server error (${response.status}): ${errorText || 'Unknown error'}`);
                        setResults(null);
                    }
                } catch (error) {
                    console.error('Analysis error:', error);
                    setError(`Network error: ${error.message}`);
                    setResults(null);
                }

                setLoading(false);
            };

            const handleContactSubmit = (e) => {
                e.preventDefault();
                console.log('Lead captured:', { ...formData, url, score: results?.overallScore });
                setFormSubmitted(true);
                setTimeout(() => {
                    setShowContactForm(false);
                    setFormSubmitted(false);
                    setFormData({ name: '', email: '', message: '' });
                }, 3000);
            };

            const getScoreColor = (score) => {
                if (score >= 80) return 'text-green-600';
                if (score >= 60) return 'text-yellow-600';
                return 'text-red-600';
            };

            return (
                <div className="max-w-6xl mx-auto p-6">
                    {/* Header */}
                    <div className="text-center mb-8">
                        <div className="flex items-center justify-center gap-3 mb-2">
                            <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" className="w-16 h-16">
                                <defs>
                                    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style={{stopColor:'#2563eb', stopOpacity:1}} />
                                        <stop offset="100%" style={{stopColor:'#4f46e5', stopOpacity:1}} />
                                    </linearGradient>
                                </defs>
                                <circle cx="40" cy="40" r="38" fill="none" stroke="url(#logoGradient)" strokeWidth="4" opacity="0.3"/>
                                <path d="M 25 45 L 35 55 L 55 30" fill="none" stroke="url(#logoGradient)" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"/>
                                <rect x="20" y="50" width="8" height="15" fill="url(#logoGradient)" rx="2"/>
                                <rect x="32" y="42" width="8" height="23" fill="url(#logoGradient)" rx="2"/>
                                <rect x="44" y="34" width="8" height="31" fill="url(#logoGradient)" rx="2"/>
                                <rect x="56" y="26" width="8" height="39" fill="url(#logoGradient)" rx="2"/>
                            </svg>
                            <h1 className="text-5xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Audity</h1>
                        </div>
                        <p className="text-gray-600 text-lg">Complete website SEO audit in seconds</p>
                    </div>

                    {/* Input Form - This section will ALWAYS be visible */}
                    <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Website URL</label>
                                <input
                                    type="url"
                                    value={url}
                                    onChange={(e) => setUrl(e.target.value)}
                                    placeholder="https://example.com"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Target Keyword (Optional)</label>
                                <input
                                    type="text"
                                    value={keyword}
                                    onChange={(e) => setKeyword(e.target.value)}
                                    placeholder="e.g., best SEO tools"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                            </div>
                            <button
                                onClick={analyzeURL}
                                disabled={!url || loading}
                                className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                            >
                                {loading ? 'Analyzing...' : (
                                    <>
                                        <Icon name="search" />
                                        Analyze Website
                                    </>
                                )}
                            </button>
                        </div>
                    </div>

                    {/* Error Display */}
                    {error && (
                        <div className="bg-red-50 border-l-4 border-red-500 rounded-lg p-6 mb-6">
                            <div className="flex items-start gap-3">
                                <Icon name="alert-triangle" className="w-6 h-6 text-red-600 flex-shrink-0 mt-0.5" />
                                <div>
                                    <h3 className="font-bold text-red-900 mb-1">Analysis Failed</h3>
                                    <p className="text-red-700">{error}</p>
                                    <p className="text-red-600 text-sm mt-2">Please check the console (F12) for more details.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Results Section - Only shows when results exist */}
                    {results && (
                        <div className="space-y-6">
                            {/* Score Overview */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <div className="text-center">
                                    <h2 className="text-2xl font-bold mb-4">Overall SEO Score</h2>
                                    <div className={`text-6xl font-bold ${getScoreColor(results.overallScore)} mb-4`}>
                                        {results.overallScore}/100
                                    </div>
                                    <p className="text-gray-600 mb-6">
                                        {results.overallScore >= 80 ? 'Excellent! Your site is well-optimized.' :
                                         results.overallScore >= 60 ? 'Good, but there\'s room for improvement.' :
                                         'Your site needs significant SEO improvements.'}
                                    </p>
                                    <button
                                        onClick={() => setShowContactForm(true)}
                                        className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-8 py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-indigo-700 flex items-center gap-2 mx-auto"
                                    >
                                        <Icon name="rocket" />
                                        Get Custom Improvement Plan
                                    </button>
                                </div>
                            </div>

                            {/* Category Scores */}
                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <Icon name="file-text" className="w-5 h-5 text-blue-600" />
                                            <h3 className="font-bold">Content</h3>
                                        </div>
                                        <span className={`text-2xl font-bold ${getScoreColor(results.categoryScores.content)}`}>
                                            {results.categoryScores.content}
                                        </span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div 
                                            className="bg-blue-600 h-2 rounded-full" 
                                            style={{width: `${results.categoryScores.content}%`}}
                                        ></div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <Icon name="code" className="w-5 h-5 text-purple-600" />
                                            <h3 className="font-bold">Technical</h3>
                                        </div>
                                        <span className={`text-2xl font-bold ${getScoreColor(results.categoryScores.technical)}`}>
                                            {results.categoryScores.technical}
                                        </span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div 
                                            className="bg-purple-600 h-2 rounded-full" 
                                            style={{width: `${results.categoryScores.technical}%`}}
                                        ></div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <Icon name="image" className="w-5 h-5 text-green-600" />
                                            <h3 className="font-bold">Images</h3>
                                        </div>
                                        <span className={`text-2xl font-bold ${getScoreColor(results.categoryScores.images)}`}>
                                            {results.categoryScores.images}
                                        </span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div 
                                            className="bg-green-600 h-2 rounded-full" 
                                            style={{width: `${results.categoryScores.images}%`}}
                                        ></div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <Icon name="link" className="w-5 h-5 text-orange-600" />
                                            <h3 className="font-bold">Links</h3>
                                        </div>
                                        <span className={`text-2xl font-bold ${getScoreColor(results.categoryScores.links)}`}>
                                            {results.categoryScores.links}
                                        </span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div 
                                            className="bg-orange-600 h-2 rounded-full" 
                                            style={{width: `${results.categoryScores.links}%`}}
                                        ></div>
                                    </div>
                                </div>
                            </div>

                            {/* Issues */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <Icon name="alert-circle" className="w-6 h-6 text-red-600" />
                                    Issues Found ({results.issues.length})
                                </h3>
                                <div className="space-y-3">
                                    {results.issues.map((issue, index) => (
                                        <div key={index} className="flex items-start gap-3 p-4 bg-red-50 rounded-lg border-l-4 border-red-500">
                                            <Icon name="x-circle" className="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" />
                                            <div className="flex-1">
                                                <p className="font-medium text-red-900">{issue.issue}</p>
                                                {issue.details && (
                                                    <p className="text-sm text-red-700 mt-1">{issue.details}</p>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Recommendations */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <Icon name="lightbulb" className="w-6 h-6 text-yellow-600" />
                                    Recommendations ({results.recommendations.length})
                                </h3>
                                <div className="space-y-3">
                                    {results.recommendations.map((rec, index) => (
                                        <div key={index} className="flex items-start gap-3 p-4 bg-yellow-50 rounded-lg border-l-4 border-yellow-500">
                                            <Icon name="check-circle" className="w-5 h-5 text-yellow-600 flex-shrink-0 mt-0.5" />
                                            <div className="flex-1">
                                                <p className="font-medium text-yellow-900">{rec.recommendation}</p>
                                                {rec.priority && (
                                                    <span className={`inline-block mt-2 px-3 py-1 rounded-full text-xs font-semibold ${
                                                        rec.priority === 'high' ? 'bg-red-100 text-red-800' :
                                                        rec.priority === 'medium' ? 'bg-yellow-100 text-yellow-800' :
                                                        'bg-green-100 text-green-800'
                                                    }`}>
                                                        {rec.priority.toUpperCase()} PRIORITY
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Keywords */}
                            {results.keywords && results.keywords.length > 0 && (
                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center gap-2 mb-4">
                                        <Icon name="trending-up" className="w-6 h-6 text-green-600" />
                                        <h3 className="text-xl font-bold">Top Keywords</h3>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full">
                                            <thead className="bg-gray-50">
                                                <tr>
                                                    <th className="px-4 py-2 text-left font-semibold">Keyword</th>
                                                    <th className="px-4 py-2 text-left font-semibold">Count</th>
                                                    <th className="px-4 py-2 text-left font-semibold">Density</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {results.keywords.slice(0, 5).map((kw, idx) => (
                                                    <tr key={idx} className="border-t">
                                                        <td className="px-4 py-2">{kw.keyword}</td>
                                                        <td className="px-4 py-2">{kw.count}</td>
                                                        <td className="px-4 py-2">{kw.density}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Contact Form Modal */}
                    {showContactForm && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg shadow-2xl max-w-md w-full p-6">
                                {formSubmitted ? (
                                    <div className="text-center py-8">
                                        <div className="text-green-600 text-6xl mb-4">✓</div>
                                        <h3 className="text-2xl font-bold mb-2">Thank You!</h3>
                                        <p className="text-gray-600">
                                            We'll send your custom SEO improvement plan within 24 hours.
                                        </p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="text-2xl font-bold mb-2">Get Your Custom Plan</h3>
                                                <p className="text-gray-600">Our experts will analyze your site</p>
                                            </div>
                                            <button
                                                onClick={() => setShowContactForm(false)}
                                                className="text-gray-400 hover:text-gray-600 text-2xl"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                        
                                        <form onSubmit={handleContactSubmit} className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Name</label>
                                                <input
                                                    type="text"
                                                    required
                                                    value={formData.name}
                                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                                    placeholder="John Doe"
                                                />
                                            </div>
                                            
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                                <input
                                                    type="email"
                                                    required
                                                    value={formData.email}
                                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                                    placeholder="john@example.com"
                                                />
                                            </div>
                                            
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Goals (optional)</label>
                                                <textarea
                                                    value={formData.message}
                                                    onChange={(e) => setFormData({...formData, message: e.target.value})}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                                    rows="3"
                                                    placeholder="I want to rank higher for..."
                                                />
                                            </div>
                                            
                                            <div className="bg-blue-50 p-3 rounded-lg text-sm">
                                                <p className="font-semibold text-blue-900">Site: {url}</p>
                                                <p className="text-blue-700">Score: {results?.overallScore}/100</p>
                                            </div>
                                            
                                            <button
                                                type="submit"
                                                className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-indigo-700"
                                            >
                                                Send Me My Custom Plan
                                            </button>
                                            
                                            <p className="text-xs text-gray-500 text-center">
                                                Free • No credit card • 24hr response
                                            </p>
                                        </form>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <SEOTool />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
